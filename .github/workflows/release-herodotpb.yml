name: Release protobuf module

on:
  workflow_dispatch:
    inputs:
      version:
        description: Protobuf module version to release, e.g. v1.0.0
        required: true
        type: string

concurrency:
  group: release-herodotpb
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Release herodotpb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v1\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable v1.x.y version for the herodotpb module." >&2
            exit 1
          fi
          tag="herodotpb/$VERSION"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists." >&2
            exit 1
          fi
          latest="$(git tag --list 'herodotpb/v1.*' | grep -E '^herodotpb/v1\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [[ -n "$latest" && "$(printf '%s\n%s\n' "$latest" "$tag" | sort -V | tail -n 1)" != "$tag" ]]; then
            echo "$tag is not newer than $latest." >&2
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: herodotpb/tools/go.mod
      - name: Check protobuf module
        working-directory: herodotpb
        env:
          GOWORK: "off"
        run: |
          go mod tidy -diff
          go test -race -timeout=5m ./...
          go vet ./...
      - name: Check generated code
        run: |
          make gen
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Check runtime integration
        run: go test -race -timeout=5m ./... ./v2/...
      - name: Publish tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          tag="herodotpb/$VERSION"
          git tag "$tag" HEAD
          git push origin "refs/tags/$tag"
