name: "Run Tests and Lint Code"

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    name: Run Tests and Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
      - uses: actions/setup-go@v2
        with:
          go-version: "1.26"
      - run: go test -coverprofile=coverage.out -timeout=1m ./... ./v2/...
      - run: go tool gcov2lcov -infile=coverage.out -outfile=coverage.lcov
      - name: Coveralls
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: coverage.lcov

  generate:
    name: Check generated code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # buf, run from v2/tools/go.mod, requires a newer Go than herodot.
          go-version-file: v2/tools/go.mod
      - run: make gen
      - run: git diff --exit-code
      - name: Breaking changes in the code table and catalog options
        if: github.event_name == 'pull_request'
        working-directory: v2
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          if ! git cat-file -e "${BASE_SHA}:v2/buf.yaml" 2>/dev/null; then
            echo "The base commit has no v2 Buf module; skipping the initial breaking check."
            exit 0
          fi
          baseline="$(mktemp -d)"
          trap 'rm -rf "$baseline"' EXIT
          git archive "$BASE_SHA" v2 | tar -x -C "$baseline"
          GOWORK=off go tool -modfile=tools/go.mod buf breaking --against "$baseline/v2"
